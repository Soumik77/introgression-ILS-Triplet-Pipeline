[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "introgression-triplets"
version = "0.4.1"
description = "Introgression-aware species-tree inference from rooted gene-tree triplets"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.10",
]

[project.scripts]
introgression-triplets = "introgression_triplets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
